<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#FAF7F0; font-family: 'Charter', 'Georgia', serif;">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1C1B18 !important; }
      .text-title { fill: #EEE9DF !important; }
      .text-sub { fill: #A39E93 !important; }
      .box { fill: #23221E !important; stroke: #34322D !important; }
      .agent-box { fill: #151412 !important; stroke: #34322D !important; }
      .arrow { stroke: #6B675E !important; }
      .accent { fill: #8DBF9F !important; }
    }
  </style>
  <rect class="bg" width="1200" height="700" fill="#FAF7F0" />
  
  <!-- Header / Metadata -->
  <text class="text-title" x="60" y="70" font-size="22" font-weight="normal" fill="#171A1D" letter-spacing="-0.5">BRIEF: 11-Agent Methodological Evaluation Pipeline</text>
  <text class="text-sub" x="60" y="100" font-size="13" font-family="system-ui, sans-serif" fill="#4E5762">Flask Architecture · Microsoft Foundry · Azure AI Search · Confidence Score Synthesis</text>
  
  <line x1="60" y1="125" x2="1140" y2="125" stroke="#E1D7C6" stroke-width="1" class="arrow" />
  
  <!-- Step 1: Input -->
  <g transform="translate(60, 160)">
    <rect class="box" width="220" height="420" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="24" y="40" font-size="15" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">RESEARCH BRIEF INPUT</text>
    <text class="text-sub" x="24" y="65" font-size="12" font-family="system-ui, sans-serif" fill="#4E5762">Raw qualitative / quantitative draft</text>
    
    <rect class="agent-box" x="20" y="95" width="180" height="70" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="32" y="125" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">Research Objectives</text>
    <text class="text-sub" x="32" y="145" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Hypotheses & decisions</text>
    
    <rect class="agent-box" x="20" y="180" width="180" height="70" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="32" y="210" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">Target Audience & Quotas</text>
    <text class="text-sub" x="32" y="230" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Participant criteria & screening</text>
    
    <rect class="agent-box" x="20" y="265" width="180" height="70" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="32" y="295" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">Proposed Methodology</text>
    <text class="text-sub" x="32" y="315" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Survey, diary, IDIs, usability</text>
  </g>
  
  <!-- Flow Arrow 1 -->
  <line x1="295" y1="370" x2="340" y2="370" stroke="#171A1D" stroke-width="1.5" class="arrow" />
  <polygon points="340,366 348,370 340,374" fill="#171A1D" class="arrow" />
  
  <!-- Step 2: 11-Agent Evaluation Engine -->
  <g transform="translate(360, 160)">
    <rect class="box" width="480" height="420" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="24" y="40" font-size="15" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">11 SPECIALISED EVALUATION AGENTS</text>
    <text class="text-sub" x="24" y="65" font-size="12" font-family="system-ui, sans-serif" fill="#4E5762">Microsoft Foundry orchestration · Azure AI Search grounding</text>
    
    <!-- Row 1 -->
    <rect class="agent-box" x="20" y="90" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="28" y="115" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">01. Objective Fit</text>
    <text class="text-sub" x="28" y="135" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Method match</text>
    
    <rect class="agent-box" x="170" y="90" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="178" y="115" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">02. Sample Validity</text>
    <text class="text-sub" x="178" y="135" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Incidence rate</text>
    
    <rect class="agent-box" x="320" y="90" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="328" y="115" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">03. Cognitive Load</text>
    <text class="text-sub" x="328" y="135" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Survey fatigue</text>
    
    <!-- Row 2 -->
    <rect class="agent-box" x="20" y="165" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="28" y="190" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">04. Bias Risk</text>
    <text class="text-sub" x="28" y="210" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Leading questions</text>
    
    <rect class="agent-box" x="170" y="165" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="178" y="190" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">05. Ecological Fit</text>
    <text class="text-sub" x="178" y="210" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Real-world context</text>
    
    <rect class="agent-box" x="320" y="165" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="328" y="190" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">06. Stimulus Design</text>
    <text class="text-sub" x="328" y="210" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Prototype fidelity</text>
    
    <!-- Row 3 -->
    <rect class="agent-box" x="20" y="240" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="28" y="265" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">07. Screening Logic</text>
    <text class="text-sub" x="28" y="285" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">False qualification</text>
    
    <rect class="agent-box" x="170" y="240" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="178" y="265" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">08. Timeline & Ops</text>
    <text class="text-sub" x="178" y="285" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Fieldwork pacing</text>
    
    <rect class="agent-box" x="320" y="240" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="328" y="265" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">09. Evidence Hierarchy</text>
    <text class="text-sub" x="328" y="285" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Secondary ground</text>
    
    <!-- Row 4 -->
    <rect class="agent-box" x="95" y="315" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="103" y="340" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">10. Ethics & Burden</text>
    <text class="text-sub" x="103" y="360" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Vulnerable users</text>
    
    <rect class="agent-box" x="245" y="315" width="135" height="65" rx="2" fill="#FAF7F0" stroke="#E1D7C6" />
    <text class="text-title" x="253" y="340" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">11. Synthetic Risk</text>
    <text class="text-sub" x="253" y="360" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">AI respondent error</text>
  </g>
  
  <!-- Flow Arrow 2 -->
  <line x1="855" y1="370" x2="895" y2="370" stroke="#171A1D" stroke-width="1.5" class="arrow" />
  <polygon points="895,366 903,370 895,374" fill="#171A1D" class="arrow" />
  
  <!-- Step 3: Synthesis & Output -->
  <g transform="translate(915, 160)">
    <rect class="box" width="225" height="420" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="24" y="40" font-size="15" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">SYNTHESIS & REPORT</text>
    <text class="text-sub" x="24" y="65" font-size="12" font-family="system-ui, sans-serif" fill="#4E5762">Methodological assessment</text>
    
    <rect class="agent-box" x="20" y="95" width="185" height="110" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-sub" x="32" y="125" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#4E5762">OVERALL CONFIDENCE</text>
    <text class="accent" x="32" y="165" font-size="36" font-family="'Charter', serif" fill="#1E372A">0–100</text>
    <text class="text-sub" x="32" y="190" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Calibrated risk score</text>
    
    <rect class="agent-box" x="20" y="220" width="185" height="160" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="32" y="245" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">Actionable Recommendations</text>
    <text class="text-sub" x="32" y="270" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">· Refined screening questions</text>
    <text class="text-sub" x="32" y="295" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">· Sample size adjustments</text>
    <text class="text-sub" x="32" y="320" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">· Fatigue reduction guidance</text>
    <text class="text-sub" x="32" y="345" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">· Alternative qualitative steps</text>
  </g>
</svg>
