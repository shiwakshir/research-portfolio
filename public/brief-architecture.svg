<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="auto" style="background:#FAF7F0; font-family: 'Source Serif 4', 'Georgia', serif;">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1C1B18 !important; }
      .text-title { fill: #EEE9DF !important; }
      .text-body { fill: #D6D1C7 !important; }
      .text-muted { fill: #A39E93 !important; }
      .box { fill: #23221E !important; stroke: #34322D !important; }
      .step-box { fill: #151412 !important; stroke: #34322D !important; }
      .rule { stroke: #34322D !important; }
      .arrow { stroke: #6B675E !important; fill: #6B675E !important; }
    }
  </style>
  <rect class="bg" width="1100" height="560" fill="#FAF7F0" />
  
  <!-- Header -->
  <text class="text-title" x="48" y="52" font-size="20" font-weight="normal" fill="#171A1D" letter-spacing="-0.01em">BRIEF: 11-Step Methodological Audit Pipeline</text>
  <text class="text-muted" x="48" y="78" font-size="12" font-family="system-ui, sans-serif" fill="#4E5762">Flask Architecture · Microsoft Foundry · Azure AI Search · Advisory Analysis</text>
  
  <line x1="48" y1="98" x2="1052" y2="98" stroke="#E1D7C6" stroke-width="1" class="rule" />
  
  <!-- Step 01: Input -->
  <g transform="translate(48, 120)">
    <rect class="box" width="180" height="390" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="18" y="32" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D" letter-spacing="0.06em">01. INGESTION</text>
    
    <rect class="step-box" x="14" y="50" width="152" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="24" y="76" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">1. Parse Brief</text>
    <text class="text-muted" x="24" y="96" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Extract core claims</text>
    
    <rect class="step-box" x="14" y="124" width="152" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="24" y="150" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">2. Query Variants</text>
    <text class="text-muted" x="24" y="170" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Generate search forms</text>
    
    <rect class="step-box" x="14" y="198" width="152" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="24" y="224" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">3. Query Model</text>
    <text class="text-muted" x="24" y="244" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Sample model priors</text>
  </g>
  
  <!-- Connector 1 -->
  <line x1="236" y1="315" x2="260" y2="315" stroke="#171A1D" stroke-width="1" class="arrow" />
  <polygon points="260,312 266,315 260,318" fill="#171A1D" class="arrow" />
  
  <!-- Step 02: Assumption & Bias Analysis -->
  <g transform="translate(274, 120)">
    <rect class="box" width="512" height="390" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="20" y="32" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D" letter-spacing="0.06em">02. AUDIT &amp; BIAS DECOMPOSITION</text>
    
    <!-- Grid 3x2 -->
    <rect class="step-box" x="16" y="50" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="26" y="76" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">4. Cluster Assumptions</text>
    <text class="text-muted" x="26" y="96" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Thematic group priors</text>
    
    <rect class="step-box" x="180" y="50" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="190" y="76" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">5. Gap Analysis</text>
    <text class="text-muted" x="190" y="96" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Find blind spots</text>
    
    <rect class="step-box" x="344" y="50" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="354" y="76" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">6. Temporal Drift</text>
    <text class="text-muted" x="354" y="96" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Flag outdated framing</text>
    
    <rect class="step-box" x="16" y="130" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="26" y="156" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">7. Hyp. Contamination</text>
    <text class="text-muted" x="26" y="176" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Leading questions</text>
    
    <rect class="step-box" x="180" y="130" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="190" y="156" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">8. Brand Priming</text>
    <text class="text-muted" x="190" y="176" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Competitor distortion</text>
    
    <rect class="step-box" x="344" y="130" width="150" height="64" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="354" y="156" font-size="11" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">9. Assumption Origins</text>
    <text class="text-muted" x="354" y="176" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Trace evidence base</text>
  </g>
  
  <!-- Connector 2 -->
  <line x1="794" y1="315" x2="818" y2="315" stroke="#171A1D" stroke-width="1" class="arrow" />
  <polygon points="818,312 824,315 818,318" fill="#171A1D" class="arrow" />
  
  <!-- Step 03: Recommendations & Synthesis -->
  <g transform="translate(832, 120)">
    <rect class="box" width="220" height="390" rx="2" fill="#FDFBF7" stroke="#E1D7C6" stroke-width="1" />
    <text class="text-title" x="18" y="32" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D" letter-spacing="0.06em">03. ADVISORY OUTPUT</text>
    
    <rect class="step-box" x="14" y="50" width="192" height="74" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="24" y="76" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">10. Method Advice</text>
    <text class="text-muted" x="24" y="96" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Corrective study design</text>
    <text class="text-muted" x="24" y="112" font-size="10" font-family="system-ui, sans-serif" fill="#4E5762">Sample &amp; screening fixes</text>
    
    <rect class="step-box" x="14" y="140" width="192" height="110" rx="2" fill="#F5F0E6" stroke="#E1D7C6" />
    <text class="text-title" x="24" y="168" font-size="12" font-weight="600" font-family="system-ui, sans-serif" fill="#171A1D">11. Confidence Synthesis</text>
    <text class="text-title" x="24" y="206" font-size="28" font-family="'Source Serif 4', 'Georgia', serif" fill="#1E372A">0–100</text>
    <text class="text-muted" x="24" y="232" font-size="11" font-family="system-ui, sans-serif" fill="#4E5762">Calibrated reliability score</text>
  </g>
</svg>
